name: Lint
on:
  pull_request:
concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"
